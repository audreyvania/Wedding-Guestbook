[build]
  # Vite is a development dependency but is required to generate dist during
  # Netlify's build. Explicitly include it even when the build environment is
  # configured for production.
  command = "npm ci --include=dev && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  included_files = ["public/template-daftar-tamu.xlsx"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login"
  to = "/.netlify/functions/api/login"
  status = 200
  force = true

[[redirects]]
  from = "/logout"
  to = "/.netlify/functions/api/logout"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
